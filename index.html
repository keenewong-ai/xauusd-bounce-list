<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>反彈日子</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>反彈日子</h1>
        <p class="sub">XAUUSD／JPN225／EURUSD／BTCUSD／HK50</p>
      </div>
      <div class="actions">
        <label class="btn primary">
          上傳 CSV
          <input id="file" type="file" accept=".csv,text/csv" hidden />
        </label>
        <button id="export" class="btn" type="button" disabled>匯出篩選結果</button>
      </div>
    </header>

    <section class="legend">
      <div><strong>規則</strong>：第一次觸及仍生效關卡 · 前瞻 1／3／5 根日線 · 反彈 ≥ 0.5×ATR(14)</div>
      <div><strong>預設區間</strong>：最近 3 個月（上傳／內建 CSV 為準）</div>
      <div><strong>星期</strong>：以觸發日 <code>00:00 UTC</code> 換算至 Asia/Hong_Kong 同 America/New_York</div>
    </section>

    <section class="filters">
      <label>品種
        <select id="filterSymbol">
          <option value="">全部</option>
          <option value="XAUUSD">XAUUSD</option>
          <option value="JPN225">JPN225</option>
          <option value="EURUSD">EURUSD</option>
          <option value="BTCUSD">BTCUSD</option>
          <option value="HK50">HK50</option>
        </select>
      </label>
      <label>來源
        <select id="filterSource">
          <option value="">全部</option>
          <option value="fvg">低效率 (fvg)</option>
          <option value="swing">Swing</option>
        </select>
      </label>
      <label>方向
        <select id="filterSide">
          <option value="">全部</option>
          <option value="sell">賣方低效率</option>
          <option value="buy">買方低效率</option>
          <option value="sh">Swing High</option>
          <option value="sl">Swing Low</option>
        </select>
      </label>
      <label>由
        <input id="from" type="date" />
      </label>
      <label>至
        <input id="to" type="date" />
      </label>
      <div class="count" id="count">0 日有反彈</div>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>品種</th>
            <th>ID</th>
            <th>日期</th>
            <th>星期（香港）</th>
            <th>星期（紐約）</th>
            <th>來源</th>
            <th>方向</th>
            <th>觸及價</th>
            <th>反彈(ATR)</th>
            <th>關卡</th>
            <th>WO</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty">等緊低效率同 swing 事件 CSV。上傳後會喺呢度顯示有反彈嘅日子。</div>
    </section>

    <footer>
      <span id="meta">未載入資料</span>
      <button id="pasteBtn" class="btn link" type="button">改貼上 CSV 文字</button>
    </footer>
  </div>

  <dialog id="pasteDlg">
    <form method="dialog" class="paste-form">
      <h2>貼上 CSV</h2>
      <textarea id="pasteArea" rows="12" placeholder="date,source,side,level_top,level_bot,touch_price,wo,...,bounce_atr,bounce_ok"></textarea>
      <div class="dlg-actions">
        <button value="cancel" class="btn">取消</button>
        <button id="pasteApply" value="default" class="btn primary">套用</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
